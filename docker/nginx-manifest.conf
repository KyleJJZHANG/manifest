# Nginx reverse proxy for Manifest
# Deploy to: /etc/nginx/sites-available/manifest
# Then: ln -s /etc/nginx/sites-available/manifest /etc/nginx/sites-enabled/
#        nginx -t && systemctl reload nginx
#
# IMPORTANT: client_max_body_size must be >= 50m because AI chat completion
# requests from BrowserOS agents can include base64 screenshots, long
# conversation histories, and 30+ tool definitions. The default 1MB limit
# causes HTTP 413 "Request Entity Too Large" errors.
# See: https://github.com/KyleJJZHANG/HyCoreAndOne-BrowserAI (commit b64d477d)

server {
    listen 80;
    server_name manifest.andone.dsbdns.hycoretech.cn;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name manifest.andone.dsbdns.hycoretech.cn;

    # --- SSL (update paths to match your cert location) ---
    ssl_certificate     /etc/letsencrypt/live/manifest.andone.dsbdns.hycoretech.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manifest.andone.dsbdns.hycoretech.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # --- Critical: allow large AI request bodies ---
    client_max_body_size 50m;

    # --- Timeouts for long-running LLM streaming responses ---
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout 60s;

    # --- Proxy to Manifest container ---
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support (for /api/v1/events)
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
    }

    # --- Chat completions endpoint: streaming + large body ---
    location /v1/chat/completions {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming response support
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Extra generous for chat completions (screenshots + tools)
        client_max_body_size 50m;
        proxy_read_timeout   600s;
    }
}
